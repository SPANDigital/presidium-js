name: build-and-release
on:
  push:
    branches:
      - develop
      - main
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: false # to disable default GITHUB_TOKEN

      - name: Mint release-bot token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PRESIDIUM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRESIDIUM_RELEASE_APP_PRIVATE_KEY }}
          repositories: presidium-js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
      
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: npx semantic-release

      # semantic-release has no outputs here; it tags HEAD locally only when this run publishes.
      - name: Detect published release
        id: after
        if: github.ref_name == 'develop'
        continue-on-error: true
        run: |
          if git tag --points-at HEAD | grep -- '-rfv\.' > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      # Own token: a missing presidium-services grant must not fail the release.
      - name: Mint services dispatch token
        id: dispatch_token
        if: github.ref_name == 'develop' && steps.after.outputs.published == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.PRESIDIUM_RELEASE_APP_ID }}
          private-key: ${{ secrets.PRESIDIUM_RELEASE_APP_PRIVATE_KEY }}
          repositories: presidium-services
          permission-actions: write

      # Services CI bundles the newest develop prerelease of this repo, so a
      # JS-only change reaches dev only if services rebuilds.
      - name: Dispatch services CI on develop
        id: dispatch
        if: steps.dispatch_token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.dispatch_token.outputs.token }}
        run: gh workflow run ci.yml -R SPANDigital/presidium-services --ref develop

      - name: Warn when dispatch is unavailable
        if: steps.after.outcome == 'failure' || steps.dispatch_token.outcome == 'failure' || steps.dispatch.outcome == 'failure'
        run: |
          echo "::warning::Could not start presidium-services CI; see the failed step above. If the token step failed, the release GitHub App likely lacks 'Actions: Read and write' or access to presidium-services."
